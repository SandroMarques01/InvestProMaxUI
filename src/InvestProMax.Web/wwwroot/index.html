<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>InvestProMax - Controle Financeiro Inteligente</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="images/logo-icon.svg" />
    <link rel="apple-touch-icon" href="images/logo-icon.svg" />
    <meta name="theme-color" content="#1e6b3c" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_content/InvestProMax.SharedUI/app.css" />
</head>

<body>
    <div id="app">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Inter',sans-serif;color:#ffffff;background:#102b1c;">
            <img src="images/logo.svg" alt="InvestProMax" style="height: 48px; max-width: 240px; margin-bottom: 24px; object-fit: contain;" />
            <img src="images/loading.gif" alt="Carregando..." style="width: 72px; height: 72px; border-radius: 12px; margin-bottom: 16px; object-fit: contain;" />
            <div style="font-weight:500;font-size:13px;color:#a7d7b5;letter-spacing:0.3px;">Carregando InvestProMax...</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:20px;left:20px;right:20px;background:#fbecea;color:#c0392b;border:1px solid #e8b8b2;padding:12px 16px;border-radius:8px;z-index:9999;font-family:'Inter',sans-serif;font-size:12px;">
        Ocorreu um erro inesperado.
        <a href="" class="reload" style="color:#c0392b;font-weight:600;margin-left:8px;">Recarregar</a>
        <a class="dismiss" style="position:absolute;right:12px;top:10px;cursor:pointer;color:#c0392b;">🗙</a>
    </div>

    <script src="_content/InvestProMax.SharedUI/download.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
